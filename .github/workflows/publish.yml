name: publish

# Two phases, and they are two runs of this workflow rather than two triggers.
#
#   1. push to main with changesets pending → Changesets opens/refreshes a
#      "Version Packages" PR that bumps package.json and writes CHANGELOG.md
#      from the .changeset/*.md files.
#   2. merging that PR empties .changeset/, so the push it produces finds no
#      changesets and the action takes its *publish* branch instead: it tags the
#      version and reports `published`, which is what releases the build below.
#
# Nothing is published to npm — the package is private. Changesets is used only
# for versioning, changelog and tagging (`privatePackages` in
# .changeset/config.json enables that for a private package), so the publish
# command is `changeset tag` and nothing more.
#
# **The build is gated on `published`, not on a tag push, and it has to be.** A
# tag pushed with GITHUB_TOKEN does not start a workflow run, so `on: push:
# tags` would never fire for a tag this workflow created. There is deliberately
# no tag trigger left: it would read as the mechanism while never running.
#
# **The action is pinned to v1.9.0 and its inputs are v1's** — `version`,
# `publish`, `commit`, `title`, `createGithubReleases`. The v2 line renamed every
# one of them to kebab-case, and an unknown `with:` key is silently ignored, so
# v2 names on v1 do nothing at all and say nothing about it. That is how a
# missing `publish` went unnoticed through a whole release: `version PR`
# succeeded in 16s, the release build was skipped for want of a tag, and no tag
# was ever created.
#
# The app version lives in ONE place: `package.json`. `src-tauri/tauri.conf.json`
# sets `"version": "../package.json"`, which Tauri resolves at build time, so
# Changesets bumping package.json is enough — there is no version sync step and
# Cargo.toml's version does not reach the bundle.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs history to work out what changed since the base
          # branch, and the tags to know which versions are already released.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v1.9.0
        with:
          # Named `version:packages`, not `version`: npm and bun treat a `version`
          # script as a lifecycle hook for `npm version`, which would recurse.
          version: bun run version:packages
          # `changeset tag` creates the tag locally and prints `New tag: v<x>`,
          # which is the only thing the action reads to decide `published` — it
          # greps stdout for it. Once that tag is on the remote the command
          # prints nothing at all, so `published` is false and a later push to
          # main cannot release the same version twice. Measured both ways.
          publish: bun run release:tag
          commit: "chore: version packages"
          title: "chore: version packages"
          # The release is created by the build below, which is the only thing
          # holding the artifacts to attach to it.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With `createGithubReleases: false` the action never pushes what
      # `changeset tag` created, and an unpushed tag would let the next push to
      # main mint the same version again. Pushing it here is what makes the
      # publish branch fire exactly once per version.
      - id: tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git push origin "v$version"

  release-linux:
    name: Linux ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One at a time: both jobs upload to the same release, and two
      # tauri-action runs creating it at once race on the release itself.
      max-parallel: 1
      matrix:
        include:
          # 22.04 rather than latest: an AppImage runs on any glibc at least as
          # new as the one it was built against, so the oldest supported runner
          # is the widest reach.
          - runner: ubuntu-22.04
            label: x86_64
          - runner: ubuntu-22.04-arm
            label: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # WebKitGTK and GTK for the window, libdbus for the Secret Service
      # keyring, patchelf and file for the AppImage, and GStreamer with its
      # plugins because `bundleMediaFramework` copies them out of the build
      # host into the AppImage so footage plays in the preview.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev patchelf file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri-action runs `beforeBuildCommand` (`bun run tauri:before-build`)
      # itself: the bun runtime for this runner's triple, the sidecar bundle and
      # the Next static export in `out/`, before compiling the Rust binary.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The app's own Pexels key: `sidecar:build` runs inside this step and
          # bakes it into the sidecar bundle with `bun build --env`. Without the
          # secret the build still succeeds — the release just ships with stock
          # search asking for a personal key.
          REMOCN_STUDIO_PEXELS_KEY: ${{ secrets.REMOCN_STUDIO_PEXELS_KEY }}
          # Crash reporting (REM-268). All four together turn the source-map
          # upload on; with any unset, `release:sourcemaps` says so and uploads
          # nothing, and the app initialises no SDK whatever Settings says. The
          # upload runs inside `tauri:before-build` because the inject must be
          # the last thing to touch the built JavaScript.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          REMOCN_STUDIO_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Remocn Studio v${{ needs.version.outputs.version }}
          releaseBody: |
            See CHANGELOG.md for what changed.

            Download the AppImage and make it executable, or install the .deb
            or .rpm with your package manager. The studio does not update
            itself: a new version is a new download, or a package upgrade.
          releaseDraft: false
          prerelease: false
          # `crash-reports` turns on the core's own half of REM-268 — the panic
          # hook and the supervisor's sidecar-crash note. It is off in
          # `Cargo.toml` so a local `cargo build` compiles neither `sentry` nor
          # its transport. `--features` takes a list, so a flag must end it.
          args: --features crash-reports --bundles appimage,deb,rpm
