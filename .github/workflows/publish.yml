name: publish

# Two phases, deliberately split.
#
#   1. push to main  → Changesets opens/refreshes a "Version Packages" PR that
#      bumps package.json and writes CHANGELOG.md from the .changeset/*.md files.
#      Merging that PR is the act of deciding to release; the action then pushes
#      a `v<version>` tag.
#   2. push of v*    → build macOS and publish the GitHub release with the
#      artifacts attached, plus the `latest.json` the in-app updater reads.
#
# Nothing is published to npm — the package is private. Changesets is used only
# for versioning, changelog and tagging (`privatePackages` in
# .changeset/config.json enables that for a private package).
#
# The app version lives in ONE place: `package.json`. `src-tauri/tauri.conf.json`
# sets `"version": "../package.json"`, which Tauri resolves at build time, so
# Changesets bumping package.json is enough — there is no version sync step and
# Cargo.toml's version does not reach the bundle.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version PR
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs history to work out what changed since the base branch.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          # Named `version:packages`, not `version`: npm and bun treat a `version`
          # script as a lifecycle hook for `npm version`, which would recurse.
          version-script: bun run version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # The release itself is created by the tag-triggered job below, which is
          # the only place that has the built artifacts to attach.
          create-github-releases: false
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    name: macOS ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One at a time, deliberately. Both jobs upload to the same release and
      # `latest.json` holds a key per platform, which tauri-action produces by
      # reading the existing asset and merging its own entries into it. Run in
      # parallel, both read the file before either has written, and the loser's
      # platform is silently dropped — an update that 404s for half the users.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple silicon
          - target: x86_64-apple-darwin
            label: Intel
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri-action runs `beforeBuildCommand` (`bun run build`) itself, producing
      # the Next static export in `out/` before compiling the Rust binary.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's own minisign key — not Apple code signing, which this
          # build still does not do. `bundle.createUpdaterArtifacts` makes the
          # CLI produce `.app.tar.gz` and a `.sig` next to it, and it fails the
          # build outright when the pubkey in tauri.conf.json has no private
          # counterpart here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: remocn studio ${{ github.ref_name }}
          releaseBody: |
            Unsigned macOS build — see CHANGELOG.md for what changed.

            macOS will refuse to open this on **first** install because it is not
            signed or notarized: right-click the app and choose Open, or run
            `xattr -dr com.apple.quarantine /Applications/remocn-studio.app`.
            In-app updates are not affected — the app replaces its own bundle,
            so nothing is quarantined.
          # Published, not a draft: a draft's assets have no reachable download
          # URL, so the updater could fetch neither `latest.json` nor the
          # `.app.tar.gz` it points at.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: true
