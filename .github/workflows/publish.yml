name: publish

# Two phases, and they are two runs of this workflow rather than two triggers.
#
#   1. push to main with changesets pending → Changesets opens/refreshes a
#      "Version Packages" PR that bumps package.json and writes CHANGELOG.md
#      from the .changeset/*.md files.
#   2. merging that PR empties .changeset/, so the push it produces finds no
#      changesets and the action takes its *publish* branch instead: it tags the
#      version and reports `published`, which is what releases the build below.
#
# Nothing is published to npm — the package is private. Changesets is used only
# for versioning, changelog and tagging (`privatePackages` in
# .changeset/config.json enables that for a private package), so the publish
# command is `changeset tag` and nothing more.
#
# **The build is gated on `published`, not on a tag push, and it has to be.** A
# tag pushed with GITHUB_TOKEN does not start a workflow run, so `on: push:
# tags` would never fire for a tag this workflow created. There is deliberately
# no tag trigger left: it would read as the mechanism while never running.
#
# **The action is pinned to v1.9.0 and its inputs are v1's** — `version`,
# `publish`, `commit`, `title`, `createGithubReleases`. The v2 line renamed every
# one of them to kebab-case, and an unknown `with:` key is silently ignored, so
# v2 names on v1 do nothing at all and say nothing about it. That is how a
# missing `publish` went unnoticed through a whole release: `version PR`
# succeeded in 16s, `release-macos` was skipped for want of a tag, and no tag was
# ever created.
#
# The app version lives in ONE place: `package.json`. `src-tauri/tauri.conf.json`
# sets `"version": "../package.json"`, which Tauri resolves at build time, so
# Changesets bumping package.json is enough — there is no version sync step and
# Cargo.toml's version does not reach the bundle.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs history to work out what changed since the base
          # branch, and the tags to know which versions are already released.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v1.9.0
        with:
          # Named `version:packages`, not `version`: npm and bun treat a `version`
          # script as a lifecycle hook for `npm version`, which would recurse.
          version: bun run version:packages
          # `changeset tag` creates the tag locally and prints `New tag: v<x>`,
          # which is the only thing the action reads to decide `published` — it
          # greps stdout for it. Once that tag is on the remote the command
          # prints nothing at all, so `published` is false and a later push to
          # main cannot release the same version twice. Measured both ways.
          publish: bun run release:tag
          commit: "chore: version packages"
          title: "chore: version packages"
          # The release is created by the build below, which is the only thing
          # holding the artifacts to attach to it.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With `createGithubReleases: false` the action never pushes what
      # `changeset tag` created, and an unpushed tag would let the next push to
      # main mint the same version again. Pushing it here is what makes the
      # publish branch fire exactly once per version.
      - id: tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git push origin "v$version"

  release-macos:
    name: macOS ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One at a time, deliberately. Both jobs upload to the same release and
      # `latest.json` holds a key per platform, which tauri-action produces by
      # reading the existing asset and merging its own entries into it. Run in
      # parallel, both read the file before either has written, and the loser's
      # platform is silently dropped — an update that 404s for half the users.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple silicon
          - target: x86_64-apple-darwin
            label: Intel
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri-action runs `beforeBuildCommand` (`bun run build`) itself, producing
      # the Next static export in `out/` before compiling the Rust binary.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's own minisign key — not Apple code signing, which this
          # build still does not do. `bundle.createUpdaterArtifacts` makes the
          # CLI produce `.app.tar.gz` and a `.sig` next to it, and it fails the
          # build outright when the pubkey in tauri.conf.json has no private
          # counterpart here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The app's own Pexels key: `sidecar:build` runs inside this step and
          # bakes it into the sidecar bundle with `bun build --env`. Without the
          # secret the build still succeeds — the release just ships with stock
          # search asking for a personal key.
          REMOCN_STUDIO_PEXELS_KEY: ${{ secrets.REMOCN_STUDIO_PEXELS_KEY }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: remocn studio v${{ needs.version.outputs.version }}
          releaseBody: |
            Unsigned macOS build — see CHANGELOG.md for what changed.

            macOS will refuse to open this on **first** install because it is not
            signed or notarized: right-click the app and choose Open, or run
            `xattr -dr com.apple.quarantine /Applications/remocn-studio.app`.
            In-app updates are not affected — the app replaces its own bundle,
            so nothing is quarantined.
          # Published, not a draft: a draft's assets have no reachable download
          # URL, so the updater could fetch neither `latest.json` nor the
          # `.app.tar.gz` it points at.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: true
