name: dev

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: format · lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `ultracite check` is formatter *and* linter in one pass (Biome under the
      # hood) and never writes files, so a violation fails the job instead of
      # being silently corrected. Run `bun run fix` locally to resolve.
      - name: Format and lint
        run: bun run check

      # The project has no separate typecheck in the app build path: Next 16
      # stopped running a linter on build, and `tsconfig.json` is `noEmit`. This
      # is the step that catches type errors — including the ones the shadcn
      # generator has shipped in `components/ui/**`, where the linter is off.
      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

  # Kept separate: the frontend gates above are fast and should report on their
  # own, while this proves the static export Tauri actually ships still builds.
  # `next build` self-hosts Google fonts at build time, so this step needs
  # network access.
  build:
    name: static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

  # The core is compiled on both platforms the app ships for, since each has
  # code the other never builds. `tauri-build` checks every resource and
  # sidecar exists before it compiles, so the bundled bun and the sidecar
  # bundle are made first; a debug build points at `devUrl`, so the static
  # export is not needed here.
  rust:
    name: rust core (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Linux
            triple: x86_64-unknown-linux-gnu
          - runner: macos-latest
            label: macOS
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.triple }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle the sidecar and fetch the shipped bun
        run: |
          bun run sidecar:build
          TAURI_ENV_TARGET_TRIPLE=${{ matrix.triple }} bun run bun:fetch

      - name: Check
        working-directory: src-tauri
        run: cargo check --features crash-reports

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # The vendored skills under `agent/skills` are a copy of upstream, and a copy
  # rots silently. This refetches them and fails when what is committed no
  # longer matches, which is the whole reason vendoring is affordable. It talks
  # to GitHub, so it is its own job rather than a step in `verify`.
  skills:
    name: vendored skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the vendored skills against upstream
        run: bun run skills:check
