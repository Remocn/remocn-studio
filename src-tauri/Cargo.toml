[package]
name = "remocn-studio"
# Internal crate version; the app release version comes from ../package.json
# through tauri.conf.json and is managed by Changesets.
version = "0.1.0"
description = "Create videos with AI as editable Remotion projects."
authors = ["Remocn"]
license = "MIT"
homepage = "https://remocn.studio"
repository = "https://github.com/Remocn/remocn-studio"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remocn_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2"
reqwest = { version = "0.13", features = ["json"] }
# Off by default, and deliberately: nothing in CI compiles this crate — the
# Rust is only ever built by the release job — so an unbuildable dependency
# tree would first be found while cutting a release. `contexts` stays on for
# the os/device context (`server_name` is overridden in `crash.rs`, which is
# the only part of it that is PII); `release-health`, `logs` and `metrics` are
# off because this reports crashes and nothing else.
sentry = { version = "0.49", optional = true, default-features = false, features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "transport",
] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
default = []
crash-reports = ["dep:sentry"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Secret Service (GNOME Keyring, KWallet) over libdbus. Without a backend
# feature keyring 3 silently falls back to its in-memory mock store.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
